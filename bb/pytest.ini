[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning

# Async tests need no decorator, and the loop scope is stated rather than
# inherited — pytest-asyncio warns on every run when it is left unset, and a
# suite that warns every run is a suite nobody reads the output of.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
